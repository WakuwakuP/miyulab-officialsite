nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.0.2.cjs

npmRegistryServer: "https://npm.flatt.tech/"

# Anonymous Takumi Guard is 2,000 req/min per IP. GitHub-hosted runners share
# IPs, so Yarn's default 50 concurrent fetches get 429s during CI install.
httpRetry: 10
networkConcurrency: 8
